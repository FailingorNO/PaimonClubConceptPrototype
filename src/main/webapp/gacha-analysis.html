<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>抽卡分析 · 派蒙社</title>
    <link rel="stylesheet" href="static/css/main.css?v=20261103b">
</head>
<body>
<div id="pc-nav"></div>
<div class="container">
    <div class="card">
        <div class="card-title">
            <span>抽卡记录分析</span>
            <small>导入记录后可查看五星率、保底分布与欧非曲线</small>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <select class="select" id="poolName" style="width:170px">
                <option value="">全部卡池</option>
            </select>
            <button class="btn" id="btn-mock">导入模拟记录（180 抽）</button>
            <button class="btn btn-line" id="btn-import">手动导入 JSON</button>
            <button class="btn btn-danger" id="btn-clear">清空我的记录</button>
        </div>
    </div>

    <div class="grid grid-3" style="margin-top:16px">
        <div class="card"><div class="stat"><div class="num" id="s-total">0</div><div class="lbl">总抽数</div></div></div>
        <div class="card"><div class="stat"><div class="num" id="s-rate">0%</div><div class="lbl">五星出率</div></div></div>
        <div class="card"><div class="stat"><div class="num" id="s-avg">0</div><div class="lbl">平均出金抽数</div></div></div>
    </div>

    <div class="grid grid-2" style="margin-top:16px">
        <div>
            <div class="card">
                <div class="card-title">保底分布 <small>抽数区间内出金次数</small></div>
                <div id="pity-chart" class="chart"></div>
            </div>
            <div class="card">
                <div class="card-title">欧非曲线 <small>累计抽数对应的五星出率</small></div>
                <div id="luck-chart" class="chart"></div>
            </div>
        </div>
        <div>
            <div class="card">
                <div class="card-title">卡池对比</div>
                <div id="pool-list"></div>
            </div>
            <div class="card">
                <div class="card-title">最近记录</div>
                <div id="record-list" style="max-height:420px;overflow:auto"></div>
            </div>
        </div>
    </div>
</div>
<script src="static/js/api.js?v=20261103b"></script>
<script>
    PC.renderNav('gacha');
    if (!PC.requireLogin()) { throw new Error('need login'); }

    function renderAnalysis(a) {
        document.getElementById('s-total').textContent = a.totalPulls || 0;
        document.getElementById('s-rate').textContent = ((a.fiveStarRate || 0) * 100).toFixed(2) + '%';
        document.getElementById('s-avg').textContent = (a.avgPullsPerFiveStar || 0).toFixed(1);
        var pity = (a.pityDistribution || []).map(function (b) {
            return { label: b.from + '-' + b.to, value: b.count };
        });
        PC.barChart('pity-chart', pity, '#f7b731');
        var luck = (a.luckCurve || []).map(function (p) {
            return { label: String(p.index), value: Number((p.rate * 100).toFixed(2)) };
        });
        PC.lineChart('luck-chart', luck, '#4a6cf7');
        var pools = a.poolStats || [];
        document.getElementById('pool-list').innerHTML = pools.length ? pools.map(function (p) {
            return '<div class="row"><div class="grow"><div class="name">' + PC.escapeHtml(p.poolName) + '</div>' +
                '<div class="sub">共 ' + p.total + ' 抽 · 五星 ' + p.fiveStar + ' · 四星 ' + p.fourStar + '</div></div>' +
                '<span class="badge">' + (p.fiveStarRate * 100).toFixed(2) + '%</span></div>';
        }).join('') : PC.empty('暂无卡池数据');
        var select = document.getElementById('poolName');
        var current = select.value;
        select.innerHTML = '<option value="">全部卡池</option>' + (a.pools || []).map(function (name) {
            return '<option value="' + PC.escapeHtml(name) + '">' + PC.escapeHtml(name) + '</option>';
        }).join('');
        select.value = current;
    }

    function loadAnalysis() {
        PC.api.get('gacha/analysis', { poolName: document.getElementById('poolName').value })
            .then(renderAnalysis)
            .catch(function (e) { PC.toast(e.message); });
    }

    function loadRecords() {
        PC.api.get('gacha/records', { page: 1, size: 60, poolName: document.getElementById('poolName').value })
            .then(function (data) {
                var host = document.getElementById('record-list');
                if (!data || !data.items || !data.items.length) { host.innerHTML = PC.empty('暂无记录'); return; }
                host.innerHTML = data.items.map(function (r) {
                    var rarity = r.rarity || 3;
                    var cls = rarity >= 5 ? 'r5' : rarity === 4 ? 'r4' : '';
                    return '<div class="pull-item ' + cls + '" style="margin-bottom:8px;text-align:left;padding:8px 10px">' +
                        '<div style="display:flex;justify-content:space-between"><span>' + PC.escapeHtml(r.itemName || '') + '</span>' +
                        '<span>' + rarity + '★</span></div>' +
                        '<div style="font-size:11.5px;opacity:.75">' + PC.escapeHtml(r.poolName || '') + ' · ' +
                        PC.fmtTime(r.pullTime || r.createdAt) + '</div></div>';
                }).join('');
            }).catch(function (e) { document.getElementById('record-list').innerHTML = PC.empty(e.message); });
    }

    document.getElementById('btn-mock').addEventListener('click', function () {
        var btn = this;
        btn.disabled = true;
        PC.api.post('gacha/import', { mock: true, poolName: document.getElementById('poolName').value || '角色活动祈愿' })
            .then(function (count) {
                PC.toast('已导入 ' + count + ' 条记录');
                loadAnalysis();
                loadRecords();
            }).catch(function (e) { PC.toast(e.message); })
            .then(function () { btn.disabled = false; });
    });

    document.getElementById('btn-import').addEventListener('click', function () {
        PC.modal('手动导入抽卡记录',
            '<p class="hint">格式：JSON 数组，每项包含 itemName、itemType、rarity、pullTime</p>' +
            '<div class="field"><textarea class="textarea" id="json" style="min-height:160px">[{"itemName":"琴","itemType":"角色","rarity":5,"pullTime":"2026-10-01 12:00:00"}]</textarea></div>',
            function (mask) {
                var text = mask.querySelector('#json').value;
                var records;
                try { records = JSON.parse(text); } catch (e) { PC.toast('JSON 格式不正确'); return false; }
                PC.api.post('gacha/import', {
                    records: records, poolName: document.getElementById('poolName').value || '手动导入'
                }).then(function (count) {
                    PC.toast('已导入 ' + count + ' 条记录');
                    loadAnalysis();
                    loadRecords();
                }).catch(function (e) { PC.toast(e.message); });
            }, '导入');
    });

    document.getElementById('btn-clear').addEventListener('click', function () {
        if (!confirm('确认清空自己的抽卡记录？')) { return; }
        PC.api.del('gacha/records').then(function () {
            PC.toast('已清空');
            loadAnalysis();
            loadRecords();
        }).catch(function (e) { PC.toast(e.message); });
    });

    document.getElementById('poolName').addEventListener('change', function () {
        loadAnalysis();
        loadRecords();
    });

    loadAnalysis();
    loadRecords();
</script>
</body>
</html>
