<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>好友与私信 · 派蒙社</title>
    <link rel="stylesheet" href="static/css/main.css?v=20261103b">
</head>
<body>
<div id="pc-nav"></div>
<div class="container">
    <div class="grid grid-2">
        <div>
            <div class="card">
                <div class="card-title">好友私信</div>
                <div class="grid" style="grid-template-columns:200px 1fr;gap:14px">
                    <div id="friend-list" style="border-right:1px dashed #e6eaf2;padding-right:10px"></div>
                    <div>
                        <div id="chat-head" style="font-weight:700;margin-bottom:10px;color:#7c8798">选择一个好友开始聊天</div>
                        <div id="chat-body" style="height:340px;overflow:auto;background:#fafbff;border-radius:10px;padding:12px"></div>
                        <div style="display:flex;gap:8px;margin-top:10px">
                            <input class="input" id="msg" placeholder="输入消息..." style="flex:1">
                            <button class="btn" id="btn-send">发送</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-title">好友申请</div>
                <div id="request-list"></div>
            </div>
        </div>
        <div>
            <div class="card">
                <div class="card-title">找人</div>
                <div style="display:flex;gap:8px">
                    <input class="input" id="kw" placeholder="搜索用户名或昵称" style="flex:1">
                    <button class="btn" id="btn-search">搜索</button>
                </div>
                <div id="search-list" style="margin-top:12px"></div>
            </div>
            <div class="card">
                <div class="card-title">关注 / 粉丝</div>
                <div class="tabs">
                    <div class="tab active" data-rel="followees">我的关注</div>
                    <div class="tab" data-rel="followers">我的粉丝</div>
                </div>
                <div id="rel-list"></div>
            </div>
        </div>
    </div>
</div>
<script src="static/js/api.js?v=20261103b"></script>
<script>
    PC.renderNav('social');
    if (!PC.requireLogin()) { throw new Error('need login'); }
    var me = PC.Store.user();
    var currentChat = null;
    var currentChatName = '';
    var pollTimer = null;

    function loadFriends() {
        PC.api.get('social/friends').then(function (list) {
            var host = document.getElementById('friend-list');
            if (!list || !list.length) {
                host.innerHTML = PC.empty('还没有好友。用右侧「找人」搜索任意用户，点「私信」可以直接开聊');
                return;
            }
            host.innerHTML = list.map(function (item) {
                var u = item.user;
                var name = u.nickname || u.username;
                return '<div class="row" data-chat="' + u.id + '" data-name="' + PC.escapeHtml(name) + '"' +
                    ' style="cursor:pointer;border:none;padding:8px 0">' +
                    PC.avatarBox(u, 'sm') +
                    '<div class="grow"><div class="name">' + PC.escapeHtml(name) + '</div></div></div>';
            }).join('');
            host.querySelectorAll('[data-chat]').forEach(function (row) {
                row.addEventListener('click', function () {
                    openChat(Number(row.getAttribute('data-chat')), row.getAttribute('data-name'));
                });
            });
        }).catch(function (e) { document.getElementById('friend-list').innerHTML = PC.empty(e.message); });
    }

    function openChat(userId, name) {
        currentChat = userId;
        currentChatName = name || ('用户 #' + userId);
        document.getElementById('chat-head').textContent = '与 ' + currentChatName + ' 的会话';
        var box = document.getElementById('msg');
        if (box) { box.focus(); }
        loadMessages();
        startPolling();
    }

    /* 打开会话后每 4 秒拉一次新消息，对方回复不用手动刷新 */
    function startPolling() {
        if (pollTimer) { clearInterval(pollTimer); }
        pollTimer = setInterval(function () {
            if (currentChat && document.visibilityState === 'visible') { loadMessages(true); }
        }, 4000);
    }

    function loadMessages(silent) {
        if (!currentChat) { return; }
        PC.api.get('social/messages/' + currentChat).then(function (list) {
            var host = document.getElementById('chat-body');
            if (!list || !list.length) {
                if (!silent) { host.innerHTML = PC.empty('还没有消息，打个招呼吧'); }
                return;
            }
            var atBottom = host.scrollHeight - host.scrollTop - host.clientHeight < 40;
            var html = list.map(function (m) {
                var mine = m.fromUser === me.id;
                return '<div style="display:flex;justify-content:' + (mine ? 'flex-end' : 'flex-start') + ';margin-bottom:10px">' +
                    '<div style="max-width:72%;background:' + (mine ? '#4a6cf7' : '#fff') + ';color:' + (mine ? '#fff' : '#1f2430') +
                    ';padding:8px 12px;border-radius:10px;border:1px solid ' + (mine ? '#4a6cf7' : '#e6eaf2') + '">' +
                    '<div>' + PC.escapeHtml(m.content) + '</div>' +
                    '<div style="font-size:11px;opacity:.7;margin-top:4px">' + PC.fmtTime(m.createdAt) + '</div></div></div>';
            }).join('');
            if (host.innerHTML === html) { return; }
            host.innerHTML = html;
            if (atBottom || !silent) { host.scrollTop = host.scrollHeight; }
        }).catch(function (e) { document.getElementById('chat-body').innerHTML = PC.empty(e.message); });
    }

    function loadRequests() {
        PC.api.get('social/friends/requests').then(function (list) {
            var host = document.getElementById('request-list');
            if (!list || !list.length) { host.innerHTML = PC.empty('暂无好友申请'); return; }
            host.innerHTML = list.map(function (item) {
                var u = item.user;
                return '<div class="row">' + PC.avatarBox(u, 'sm') +
                    '<div class="grow"><div class="name">' + PC.escapeHtml(u.nickname || u.username) + '</div>' +
                    '<div class="sub">' + PC.fmtTime(item.createdAt) + '</div></div>' +
                    '<button class="btn btn-sm" data-accept="' + u.id + '">同意</button>' +
                    '<button class="btn btn-sm btn-line" data-reject="' + u.id + '">拒绝</button></div>';
            }).join('');
            host.querySelectorAll('[data-accept]').forEach(function (b) {
                b.addEventListener('click', function () { action(Number(b.getAttribute('data-accept')), 'ACCEPT'); });
            });
            host.querySelectorAll('[data-reject]').forEach(function (b) {
                b.addEventListener('click', function () { action(Number(b.getAttribute('data-reject')), 'REJECT'); });
            });
        }).catch(function (e) { document.getElementById('request-list').innerHTML = PC.empty(e.message); });
    }

    function action(userId, act) {
        PC.api.post('social/friends/action', { friendId: userId, action: act }).then(function (msg) {
            PC.toast(msg || '操作成功');
            loadRequests();
            loadFriends();
        }).catch(function (e) { PC.toast(e.message); });
    }

    function search() {
        var keyword = document.getElementById('kw').value.trim();
        if (!keyword) { PC.toast('请输入搜索关键词'); return; }
        PC.api.get('users/search', { keyword: keyword, page: 1, size: 10 }).then(function (data) {
            var host = document.getElementById('search-list');
            if (!data.items || !data.items.length) { host.innerHTML = PC.empty('没有找到用户'); return; }
            host.innerHTML = data.items.map(function (u) {
                var name = u.nickname || u.username;
                var btn = u.id === me.id ? '' :
                    '<button class="btn btn-sm" data-chat-start="' + u.id + '" data-name="' + PC.escapeHtml(name) + '">私信</button>' +
                    '<button class="btn btn-sm btn-line" data-follow="' + u.id + '">' + (u.followed ? '已关注' : '关注') + '</button>' +
                    '<button class="btn btn-sm btn-line" data-add="' + u.id + '">加好友</button>';
                return '<div class="row">' + PC.avatarBox(u, 'sm') +
                    '<div class="grow"><div class="name">' + PC.escapeHtml(name) + '</div>' +
                    '<div class="sub">' + (u.points || 0) + ' 积分 · 粉丝 ' + (u.followers || 0) + '</div></div>' + btn + '</div>';
            }).join('');
            host.querySelectorAll('[data-follow]').forEach(function (b) {
                b.addEventListener('click', function () {
                    PC.api.post('social/follow/' + b.getAttribute('data-follow')).then(function (on) {
                        PC.toast(on ? '已关注' : '已取消关注');
                        search();
                    }).catch(function (e) { PC.toast(e.message); });
                });
            });
            host.querySelectorAll('[data-chat-start]').forEach(function (b) {
                b.addEventListener('click', function () {
                    openChat(Number(b.getAttribute('data-chat-start')), b.getAttribute('data-name'));
                });
            });
            host.querySelectorAll('[data-add]').forEach(function (b) {
                b.addEventListener('click', function () { action(Number(b.getAttribute('data-add')), 'APPLY'); });
            });
        }).catch(function (e) { PC.toast(e.message); });
    }

    function loadRelation(type) {
        PC.api.get('social/' + type + '/' + me.id).then(function (list) {
            var host = document.getElementById('rel-list');
            if (!list || !list.length) { host.innerHTML = PC.empty('暂无数据'); return; }
            host.innerHTML = list.map(function (u) {
                return '<div class="row">' + PC.avatarBox(u, 'sm') +
                    '<div class="grow"><a class="name" href="user-center.html?id=' + u.id + '">' +
                    PC.escapeHtml(u.nickname || u.username) + '</a><div class="sub">' + (u.points || 0) + ' 积分</div></div></div>';
            }).join('');
        }).catch(function (e) { document.getElementById('rel-list').innerHTML = PC.empty(e.message); });
    }

    document.getElementById('btn-search').addEventListener('click', search);
    document.getElementById('kw').addEventListener('keydown', function (e) { if (e.key === 'Enter') { search(); } });
    document.getElementById('btn-send').addEventListener('click', function () {
        var input = document.getElementById('msg');
        var content = input.value.trim();
        if (!currentChat) { PC.toast('请先选择好友'); return; }
        if (!content) { return; }
        PC.api.post('social/messages', { toUser: currentChat, content: content }).then(function () {
            input.value = '';
            loadMessages();
        }).catch(function (e) { PC.toast(e.message); });
    });

    document.querySelectorAll('[data-rel]').forEach(function (t) {
        t.addEventListener('click', function () {
            document.querySelectorAll('[data-rel]').forEach(function (x) { x.classList.remove('active'); });
            t.classList.add('active');
            loadRelation(t.getAttribute('data-rel'));
        });
    });

    window.addEventListener('beforeunload', function () {
        if (pollTimer) { clearInterval(pollTimer); }
    });

    loadFriends();
    loadRequests();
    loadRelation('followees');
</script>
</body>
</html>
